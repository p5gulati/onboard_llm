services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - chromadb
  
  postgres:
    image: postgres:15
    environment: 
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: onboard_db

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"